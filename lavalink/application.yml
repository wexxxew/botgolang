server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    # Плагин для воспроизведения с YouTube (встроенный источник в Lavalink v4 выключен).
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      snapshot: false
  server:
    # Пароль должен совпадать с тем, что использует бот (по умолчанию youshallnotpass).
    password: "youshallnotpass"
    sources:
      youtube: false # отключено — работаем через плагин youtube-source
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    # OAuth: Lavalink обращается к YouTube «как залогиненный пользователь».
    # Лечит ошибку "This video requires login" на серверных IP.
    # При первом запуске в логах появится код и ссылка для авторизации.
    oauth:
      enabled: true
      # После авторизации Lavalink выведет refreshToken — можно вписать его
      # в переменную окружения YOUTUBE_OAUTH_REFRESH_TOKEN, чтобы не логиниться заново.
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
    # Набор «клиентов» YouTube — повышает шанс успешного воспроизведения.
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED

logging:
  level:
    root: INFO
    lavalink: INFO
